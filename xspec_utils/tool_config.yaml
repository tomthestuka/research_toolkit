# Per-package tool configuration, read by auto_research's ToolkitRegistry.
# Modular by design: this lives with the package, so the orchestration layer never
# needs to know about xspec_utils' tools.

# Maximum wall-clock runtime (seconds) allowed per tool, keyed by the tool's short name.
call_timeout_s:
  # ixpe_pcube_timeseg has no internal timeout knob of its own — it runs one
  # xpselect+xpbin PCUBE reduction per elapsed-time segment plus one integrated
  # reduction. At the default segment_duration_s=5000s a multi-day observation
  # can produce O(100) segments, each taking ~10-15s; set the backstop well
  # above that worst case rather than the 300s orchestration default. This cap
  # is held fixed (not raised) by design: the GTI pre-reduction gate (skip
  # near-zero-exposure windows) and the incremental checkpoint/resume (append
  # + flush each segment row, pick up only the missing segments on the next
  # call) are what let a long observation finish -- across repeated 5400s
  # calls if needed -- rather than raising this backstop further.
  ixpe_pcube_timeseg: 5400

  # ixpe_reduce_pha has no internal timeout knob either: one xpselect + one
  # xpbin PHA1/PHA1Q/PHA1U pair (src, bkg) per call, all 3 DUs passed
  # together (not looped per-DU), plus one find_src centroid pass on the
  # ~200-270MB DU1 event file when a fresh reduction is needed. Comfortably
  # faster than a single ixpe_pcube_timeseg segment loop, but still well
  # above the 300s orchestration default on a cold CALDB cache.
  ixpe_reduce_pha: 900

  # ixpe_pcube has no internal timeout knob either: one xpselect + one xpbin
  # PCUBE pair (src, bkg) per call, same shape as ixpe_reduce_pha's pha()
  # core but with no find_src centroiding step (ra/dec are required inputs).
  # A multi-ObsID combined request concatenates every listed ObsID's DU
  # event files into that same single xpselect/xpbin pair, so runtime scales
  # with total combined event volume rather than ObsID count; set well above
  # ixpe_reduce_pha's single-ObsID 900s to absorb a several-ObsID combination.
  ixpe_pcube: 1800

  # load_data's IXPE ixpe_changes=true branch now centroids (find_src) and
  # re-runs red_ixpe.pha -- the same find_src + xpselect + xpbin PHA1/Q/U
  # cost ixpe_reduce_pha's fresh-reduction path budgets 900s for. Previously
  # ixpe_changes=true raised immediately (no ra/dec ever reached pha()), so
  # this path had no real runtime; now that it does the reduction, give it
  # the same backstop as ixpe_reduce_pha. epoch['IXPE'] now loops over any
  # number of ObsIDs (each independently centroided/reduced), so the real
  # runtime scales with ObsID count; raised to cover a several-ObsID joint
  # load (e.g. the Krawczynski+2022 May+June validation pair) rather than
  # only ever a single ObsID.
  load_data: 2700

  # ixpe_qu_slice_pcubes has no internal timeout knob either: per sub-
  # observation it runs one whole-sub-obs xpselect+xpbin PCUBE plus up to
  # n_max (default 25) per-slice xpselect+xpbin PCUBE calls, and an N-way
  # split (e.g. a literature-merged ObsID like 03002599) repeats that whole
  # sequence once per sub-observation. Worst case at production defaults is
  # comparable to ixpe_pcube_timeseg's O(100)-segment budget (a handful of
  # sub-obs * up to 26 reductions each), so this gets the same order-of-
  # magnitude backstop rather than the 300s orchestration default.
  ixpe_qu_slice_pcubes: 5400

  # ixpe_qu_lag_dcf is pure numpy/scipy (no xspec/ixpeobssim reduction) -- its
  # cost is O(n_permutations + n_bootstrap) O(N^2)-pair DCF binnings per
  # subobs, N being that subobs's own slice count (n_max<=25 by default in
  # ixpe_qu_slice_pcubes). Measured: 3 ObsIDs (40/50/20 slices) at the full
  # production defaults (n_permutations=1000, n_bootstrap=1000) took ~4.3s
  # end to end; a much larger batch (e.g. a 40-ObsID lag census) stays
  # comfortably under a minute by the same scaling. Backstop set well above
  # that measured cost, not because the tool is expected to need it.
  ixpe_qu_lag_dcf: 900

# Per-package Layer-B (pytest) budget, applied to EACH of the gate's two runs.
# ixpe_pcube_timeseg's tests exercise several real xpselect+xpbin PCUBE
# reductions on real, already-local IXPE Level-2 event files (01250401,
# 02001901) to validate the GTI gate, resume/override, and bounded-return
# behaviour against genuine, already-local data; ~30 real
# reductions at ~8-10s each measured in-sandbox, well under the 900s default,
# but this raises it modestly to absorb slower CI hardware. ixpe_qu_slice_
# pcubes' tests add real reductions on 01002901/03002599 (larger event files
# than 01250401/02001901), each test call bounding n_max small (2-3) to keep
# the real xpselect/xpbin count low; raised further to absorb both files'
# larger per-call I/O cost on slower CI hardware.
gate_test_timeout_s: 2400
